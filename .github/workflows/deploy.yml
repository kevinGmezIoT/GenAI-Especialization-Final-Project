name: Continuous Training and Sync to Hugging Face

on:
  push:
    branches: [ "master" ]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull data from DVC
        env:
          AWS_NO_SIGN_REQUEST: "YES"
        run: |
          dvc remote default storage
          dvc pull data/processed/output_target.csv

      - name: Train model
        run: |
          python src/models/train.py

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add models/credit_risk_model.joblib
          git commit -m "Auto-train: add model file" || echo "No changes to commit"
          git push --force https://Kiot:$HF_TOKEN@huggingface.co/spaces/Kiot/final-fieecs-ia master:main
